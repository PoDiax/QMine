plugins {
    id 'dev.architectury.loom' version '1.11.454'
    id 'maven-publish'
}

version = "${project.mod_version}"
group = project.maven_group
base.archivesName = project.archives_base_name

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDir "src/client/java"
        }
        resources {
            srcDir "src/client/resources"
        }
    }
}

loom {
    forge {
        mixinConfig "qmine.mixins.json"
        mixinConfig "qmine.client.mixins.json"
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${project.forge_version}"

    compileOnly "dev.isxander.yacl:yet-another-config-lib-forge:3.2.1+1.20"
    compileOnly "org.jspecify:jspecify:1.0.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    withSourcesJar()
}
